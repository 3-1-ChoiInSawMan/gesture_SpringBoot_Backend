name: Spring Boot CI/CD Deploy

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gesture-core
  CONTAINER_NAME: gesture-core

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 공식 액션 (캐싱 + 클린업 자동 처리)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle 빌드 (테스트 제외 - PR 단계에서 이미 검증됨)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker 이미지 빌드 & 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      # JWT PEM 파일을 EC2에 배포
      - name: Deploy JWT keys to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            mkdir -p /home/ubuntu/app/keys
            chmod 700 /home/ubuntu/app/keys
            cat > /home/ubuntu/app/keys/private_key.pem << 'EOF'
            ${{ secrets.JWT_PRIVATE_KEY }}
            EOF
            cat > /home/ubuntu/app/keys/public_key.pem << 'EOF'
            ${{ secrets.JWT_PUBLIC_KEY }}
            EOF
            chmod 600 /home/ubuntu/app/keys/private_key.pem
            chmod 644 /home/ubuntu/app/keys/public_key.pem

      # EC2에 SSH 접속 후 배포
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DOCKER_IMAGE,CONTAINER_NAME
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart always \
              -p 8082:8082 \
              -e "SPRING_PROFILES_ACTIVE=prod" \
              -e "DB_URL=${{ secrets.DB_URL }}" \
              -e "DB_USERNAME=${{ secrets.DB_USERNAME }}" \
              -e "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
              -e AWS_S3_BUCKET="${{ secrets.AWS_S3_BUCKET }}" \
              -e AWS_REGION="${{ secrets.AWS_REGION }}" \
              -v /home/ubuntu/app/keys:/app/keys:ro \
              ${{ env.DOCKER_IMAGE }}:latest
            docker image prune -f
            echo "배포 완료!"