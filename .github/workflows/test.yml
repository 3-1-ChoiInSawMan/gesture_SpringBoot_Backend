name: Spring Boot CI Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: gesture_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 테스트용 JWT 키 생성 (운영 키와 완전히 무관한 더미)
      - name: Generate test JWT keys
        run: |
          mkdir -p /tmp/test-keys
          openssl genrsa -out /tmp/test-keys/private_key.pem 2048
          openssl rsa -in /tmp/test-keys/private_key.pem -pubout -out /tmp/test-keys/public_key.pem
          ls -la /tmp/test-keys/

      - name: Run tests with Gradle
        env:
          SPRING_PROFILES_ACTIVE: test
          AWS_ACCESS_KEY: dummy
          AWS_SECRET_KEY: dummy
          AWS_REGION: ap-northeast-2
          AWS_S3_BUCKET: dummy-bucket
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/test-results/test/*.xml